$kind: http-request
name: Créer un contrat
method: POST
url: '{{baseUrl}}/api/contrats'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "dateSignature": "2026-11-02",
      "montantTotal": 480.00,
      "valide": true
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Statut 201", () => pm.response.to.have.status(201));
      pm.environment.set("contratId", pm.response.json().idContrat);
