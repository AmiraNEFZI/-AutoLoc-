$kind: http-request
name: Créer un contrat avec ID
method: POST
url: '{{baseUrl}}/api/contrats'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "idContrat": 5,
      "dateSignature": "2026-11-02",
      "montantTotal": 480.00,
      "valide": true
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Statut 400", () => pm.response.to.have.status(400));
